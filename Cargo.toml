[package]
name = "ferrograd"
version = "0.1.0"
edition = "2024"
description = "Rust-backed statistics for reinforcement-learning benchmark scores"
license = "MIT OR Apache-2.0"

[dependencies]
rand = "0.8"
rayon = "1.10"
pyo3 = "=0.29.2"
numpy = "=0.29.0"
rand_chacha = "0.3"

[lib]
name = "ferrograd"
crate-type = ["cdylib", "rlib"]
